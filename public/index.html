<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PERSONAL INFORMATION</title>
<link rel="stylesheet" href="site.css" />
</head>
<body>
  <main class="card">
    <aside class="panel">
      <div class="badge"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50.00,2.00 56.00,17.00 60.50,14.00 62.50,31.00 74.50,24.00 71.00,42.50 89.00,37.00 83.50,52.00 77.00,56.00 81.00,71.00 63.00,62.50 52.70,73.00 52.70,97.00 47.30,97.00 47.30,73.00 37.00,62.50 19.00,71.00 23.00,56.00 16.50,52.00 11.00,37.00 29.00,42.50 25.50,24.00 37.50,31.00 39.50,14.00 44.00,17.00" fill="#D52B1E"/></svg></div>
      <h1>PERSONAL INFORMATION</h1>
      <p class="lead">Please fill in the following details to submit your membership application</p>
      <ul class="points">
        <li>Passport number is stored encrypted</li>
        <li>We will contact you after reviewing your application</li>
      </ul>
    </aside>

    <section class="formpane">
      <h2>PERSONAL INFORMATION</h2>
      <p class="hint">All fields are required</p>

      <form id="membershipForm" novalidate>
        <div id="errorBox" class="error" role="alert"></div>

        <div class="field">
          <label for="full_name">Full Name <span aria-hidden="true">*</span></label>
          <div class="control">
            <input id="full_name" name="full_name" type="text" minlength="2" maxlength="100" autocomplete="name" placeholder="Name as in passport" required />
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>
          </div>
        </div>
        <div class="field">
          <label for="email">Email <span aria-hidden="true">*</span></label>
          <div class="control">
            <input id="email" name="email" type="email" maxlength="255" autocomplete="email" dir="auto" placeholder="name@example.com" required />
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7.5l8 5.5 8-5.5"/></svg></span>
          </div>
        </div>
        <div class="field">
          <label for="passport_number">Passport Number <span aria-hidden="true">*</span></label>
          <div class="control">
            <input id="passport_number" name="passport_number" type="text" minlength="6" maxlength="12" autocomplete="off" dir="auto" placeholder="AB1234567" required />
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="12" cy="10" r="3"/><path d="M9 16.5h6"/></svg></span>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="cta">
          <span id="submitText">Submit Request</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
