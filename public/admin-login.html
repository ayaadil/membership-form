<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Access the Admin Panel</title>
<style>
  :root {
    --red: #d3202d;
    --red-2: #b30f1f;
    --red-dark: #8c0a16;
    --text: #1d1517;
    --muted: #7a6e70;
    --line: #ddd2d3;
  }
  * { box-sizing: border-box; }

  
  html { background: #14060b; }
  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Tahoma", "Segoe UI", sans-serif;
    color: var(--text);
    background: transparent;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      /* حلقات رفيعة (ديكور) */
      radial-gradient(circle at 86% 16%, transparent 0 188px, rgba(255,255,255,0.09) 189px 190px, transparent 191px),
      radial-gradient(circle at 86% 16%, transparent 0 268px, rgba(255,255,255,0.06) 269px 270px, transparent 271px),
      radial-gradient(circle at 10% 92%, transparent 0 148px, rgba(255,255,255,0.08) 149px 150px, transparent 151px),
      /* توهّجات ملوّنة */
      radial-gradient(55% 50% at 10% 8%,  rgba(211, 32, 45, 0.60), transparent 62%),
      radial-gradient(45% 45% at 92% 88%, rgba(242, 150, 160, 0.34), transparent 66%),
      radial-gradient(40% 40% at 88% 10%, rgba(142, 14, 28, 0.60), transparent 62%),
      linear-gradient(160deg, #14060b 0%, #2b0a13 50%, #12050a 100%);
  }

  /* ===== الكارد: شكل فريد (زوايا متقابلة كبيرة/صغيرة) ===== */
  .card {
    position: relative;
    width: 100%;
    max-width: 400px;
    padding: 38px 34px 30px;
    background: #fffdfd;
    border-radius: 48px 10px 48px 10px;
    box-shadow:
      0 40px 80px rgba(0, 0, 0, 0.45),
      0 8px 24px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  /* ربع دائرة حمراء بالزاوية */
  .card::before {
    content: "";
    position: absolute;
    top: -70px;
    left: -70px;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
  }
  /* دائرة رفيعة بالزاوية المقابلة */
  .card::after {
    content: "";
    position: absolute;
    bottom: -56px;
    right: -56px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 1.5px solid rgba(211, 32, 45, 0.28);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

  .inner { position: relative; z-index: 1; }

  /* ===== الرأس ===== */
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .badge {
    flex: none;
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    color: #fff;
    background: linear-gradient(145deg, var(--red) 0%, var(--red-dark) 100%);
    border-radius: 18px 6px 18px 6px;
    box-shadow: 0 10px 20px rgba(179, 15, 31, 0.35);
  }
  .badge svg { width: 26px; height: 26px; }
  h1 { margin: 0; font-size: 1.3rem; font-weight: 800; color: var(--text); }
  .sub { margin: 4px 0 0; font-size: 0.82rem; color: var(--muted); }
  .rule { height: 1px; margin: 22px 0 18px; background: linear-gradient(90deg, var(--line), transparent); }

  /* ===== الحقول (خط سفلي + عنوان عائم) ===== */
  .field { position: relative; margin-bottom: 20px; }
  .field input {
    display: block;
    width: 100%;
    height: 54px;
    padding: 20px 34px 6px 34px;
    border: 0;
    border-bottom: 1.5px solid var(--line);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    border-radius: 0;
  }
  .field input:focus { outline: none; }
  .field .ico {
    position: absolute;
    right: 0;
    bottom: 14px;
    width: 22px;
    height: 22px;
    color: #b9aeb0;
    transition: color .2s;
    pointer-events: none;
  }
  .field .ico svg { width: 100%; height: 100%; }
  .field:focus-within .ico { color: var(--red); }

  .field .lbl {
    position: absolute;
    right: 34px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.95rem;
    color: var(--muted);
    pointer-events: none;
    transform-origin: right center;
    transition: top .18s, transform .18s, color .18s, font-size .18s;
  }
  .field input:focus ~ .lbl,
  .field input:not(:placeholder-shown) ~ .lbl,
  .field input:-webkit-autofill ~ .lbl {
    top: 11px;
    transform: translateY(-50%);
    font-size: 0.74rem;
    font-weight: 700;
  }
  .field input:focus ~ .lbl { color: var(--red); }

  /* خط التركيز الأحمر */
  .field .bar {
    position: absolute;
    right: 0;
    left: 0;
    bottom: 0;
    height: 2px;
    background: linear-gradient(270deg, var(--red), var(--red-dark));
    transform: scaleX(0);
    transform-origin: right;
    transition: transform .25s ease;
  }
  .field:focus-within .bar { transform: scaleX(1); }

  /* زر إظهار/إخفاء كلمة السر */
  .eye {
    position: absolute;
    left: 0;
    bottom: 11px;
    width: 28px;
    height: 28px;
    padding: 3px;
    border: 0;
    background: none;
    color: #b9aeb0;
    cursor: pointer;
    border-radius: 8px;
  }
  .eye:hover { color: var(--red); }
  .eye svg { width: 100%; height: 100%; }
  .eye .off { display: none; }
  .eye.on .on { display: none; }
  .eye.on .off { display: block; }

  /* ===== رسالة الخطأ ===== */
  .error {
    display: none;
    margin: 2px 0 14px;
    padding: 10px 12px;
    font-size: 0.85rem;
    color: var(--red-dark);
    background: #fdf0f0;
    border-right: 3px solid var(--red);
    border-radius: 4px 10px 10px 4px;
  }

  /* ===== زر الدخول (نفس شكل الكارد) ===== */
  .go {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    height: 52px;
    margin-top: 6px;
    border: 0;
    border-radius: 20px 6px 20px 6px;
    background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
    color: #fff;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(179, 15, 31, 0.35);
    transition: transform .15s, filter .15s, box-shadow .15s;
  }
  .go svg { width: 20px; height: 20px; transition: transform .2s; }
  .go:hover { filter: brightness(1.08); box-shadow: 0 14px 28px rgba(179, 15, 31, 0.42); }
  .go:hover svg { transform: translateX(-4px); }
  .go:active { transform: translateY(1px); }
  .go:disabled { opacity: 0.65; cursor: not-allowed; }

  .foot { margin: 18px 0 0; text-align: center; font-size: 0.76rem; color: #a99d9f; }

  @media (max-width: 440px) {
    .card { padding: 32px 24px 26px; border-radius: 40px 8px 40px 8px; }
    .card::before { width: 110px; height: 110px; top: -64px; left: -64px; }
  }
</style>
<link rel="stylesheet" href="admin.bg.css" />
</head>
<body>
  <main class="card">
    <div class="inner">
      <div class="head">
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor"/></svg>
        </div>
        <div>
          <h1>Admin Login</h1>
          <p class="sub">Please enter your credentials to access the admin panel</p>
        </div>
      </div>
      <div class="rule"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <input id="email" name="email" type="email" dir="auto" autocomplete="username" placeholder=" " required autofocus />
          <label class="lbl" for="email">Email Address</label>
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7.5l8 5.5 8-5.5"/></svg></span>
          <span class="bar"></span>
        </div>

        <div class="field">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder=" " required />
          <label class="lbl" for="password">Password</label>
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M18 12v3M21 12v2.5"/></svg></span>
          <button type="button" class="eye" id="togglePw" aria-label="Toggle Password Visibility">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
          </button>
          <span class="bar"></span>
        </div>

        <div id="errorBox" class="error" role="alert"></div>

        <button type="submit" id="loginBtn" class="go">
          <span id="btnText">Login</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
      </form>

      <p class="foot">Area reserved for administrators only</p>
    </div>
  </main>

  <script src="admin-login.js"></script>
</body>
</html>
